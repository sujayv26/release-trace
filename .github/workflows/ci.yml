name: ReleaseTrace CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q demo
      - run: python -m unittest discover -s demo -v
      - run: python demo/release_trace_demo.py
      - run: python demo/release_gate.py
      - run: python -m pip install -r service/requirements.txt httpx
      - run: python -m unittest service.test_pipeline -v
