name: ReleaseTrace CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q demo
      - run: python -m unittest discover -s demo -v
      - run: python demo/release_trace_demo.py
      - run: python demo/release_gate.py
      - run: python -m pip install -r service/requirements.txt
      - run: python -m unittest service.test_schema service.test_pipeline service.test_github_check service.test_evaluate_builds service.test_check_queue service.test_investigator -v
  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: releasetrace
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: releasetrace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U releasetrace -d releasetrace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RELEASETRACE_TEST_DATABASE_URL: postgresql+psycopg://releasetrace:ci-test-password@127.0.0.1:5432/releasetrace_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r service/requirements.txt
      - run: python -m unittest service.test_pipeline service.test_check_queue -v
  temporal:
    name: Temporal recovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r service/requirements.temporal.txt
      - run: python -m unittest service.test_temporal_worker -v
  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
  compose:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Start stack and apply migrations
        run: docker compose up --build --wait --wait-timeout 90
      - name: Verify dashboard, signed fixture, and investigation
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/ | grep -F 'Open release history' >/dev/null
          docker compose exec -T api python -m service.smoke_demo
      - name: Start passing build targets and verify protected approval
        run: |
          docker compose -f compose.yaml -f compose.approval.yaml up --build --wait --wait-timeout 90
          docker compose -f compose.yaml -f compose.approval.yaml exec -T api python -m service.smoke_approval
      - name: Print stack diagnostics
        if: failure()
        run: |
          docker compose -f compose.yaml -f compose.approval.yaml ps --all
          docker compose -f compose.yaml -f compose.approval.yaml logs --no-color
      - name: Tear down CI stack
        if: always()
        run: docker compose -f compose.yaml -f compose.approval.yaml down --volumes
