name: ReleaseTrace canary drill
on:
  push:
    branches: [develop]
    paths:
      - 'staging/**'
      - 'service/**'
      - 'demo/**'
      - '.github/workflows/staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create isolated Kubernetes cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: releasetrace
          version: v0.27.0
          registry: true
          registry_port: 5001
      - name: Install Argo Rollouts
        run: |
          kubectl create namespace argo-rollouts
          kubectl apply --namespace argo-rollouts -f https://github.com/argoproj/argo-rollouts/releases/download/v1.8.3/install.yaml
          kubectl rollout status deployment/argo-rollouts --namespace argo-rollouts --timeout=120s
          kubectl create namespace release-drill
      - name: Observe promotion and automatic abort
        run: |
          set -o pipefail
          python staging/run_drill.py --context kind-releasetrace --namespace release-drill | tee rollout-evidence.json
      - name: Save measured rollout evidence
        uses: actions/upload-artifact@v4
        with:
          name: rollout-evidence
          path: rollout-evidence.json
      - name: Build and register evaluation images
        run: |
          docker build -t releasetrace-service:local -f service/Dockerfile .
          for variant in baseline candidate; do
            tag="localhost:5001/support:$variant"
            docker build --provenance=false --build-arg "VARIANT=$variant" -t "$tag" -f staging/BuildTarget.Dockerfile .
            docker push "$tag"
            ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$tag")"
            for node in $(kind get nodes --name releasetrace); do
              docker exec "$node" crictl pull "$ref"
            done
            printf 'RELEASETRACE_%s_IMAGE=%s\n' "${variant^^}" "$ref" >> "$GITHUB_ENV"
          done
      - name: Evaluate, approve, and promote the same OCI image
        run: |
          set -o pipefail
          python -m pip install -r service/requirements.txt
          kubectl create namespace approved-drill
          python -m staging.rehearse_approval --context kind-releasetrace --namespace approved-drill \
            --baseline "$RELEASETRACE_BASELINE_IMAGE" --candidate "$RELEASETRACE_CANDIDATE_IMAGE" \
            --commit "$GITHUB_SHA" | tee approved-rollout-evidence.json
      - name: Save approval-to-rollout evidence
        uses: actions/upload-artifact@v4
        with:
          name: approved-rollout-evidence
          path: approved-rollout-evidence.json
      - name: Inspect controller state on failure
        if: failure()
        run: |
          kubectl get rollouts,analysisruns,replicasets,pods,services --namespace release-drill -o yaml
          kubectl get rollouts,analysisruns,replicasets,pods,services --namespace approved-drill -o yaml || true
          kubectl get events --namespace approved-drill --sort-by=.lastTimestamp || true
          kubectl logs deployment/argo-rollouts --namespace argo-rollouts --tail=80
