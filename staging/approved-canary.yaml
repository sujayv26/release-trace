apiVersion: v1
kind: Service
metadata:
  name: support-stable
spec:
  selector:
    app: approved-support
  ports:
    - port: 8100
---
apiVersion: v1
kind: Service
metadata:
  name: support-canary
spec:
  selector:
    app: approved-support
  ports:
    - port: 8100
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: approved-support
spec:
  metrics:
    - name: account-closure-citation
      count: 1
      failureLimit: 0
      provider:
        job:
          spec:
            activeDeadlineSeconds: 60
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                automountServiceAccountToken: false
                containers:
                  - name: probe
                    image: python:3.12-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
                    command:
                      - python
                      - -c
                      - |
                        import json
                        import time
                        from urllib.error import URLError
                        from urllib.request import Request, urlopen

                        with open("/etc/releasetrace/targets.json") as file:
                            expected = json.load(file)["candidate"]["build"]
                        request = Request(
                            "http://support-canary:8100/evaluate",
                            data=b'{"case_id":"account-closure","question":"How do I close my account?"}',
                            headers={"Content-Type": "application/json"},
                        )
                        for attempt in range(15):
                            try:
                                with urlopen(request, timeout=2) as response:
                                    result = json.load(response)
                                if result == {"build": expected, "citation": "account-closure-v2"}:
                                    break
                            except (URLError, TimeoutError):
                                pass
                            time.sleep(1)
                        else:
                            raise SystemExit("Candidate did not return the approved build and current policy")
                    volumeMounts:
                      - name: targets
                        mountPath: /etc/releasetrace
                        readOnly: true
                volumes:
                  - name: targets
                    configMap:
                      name: evaluation-targets
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: approved-support
spec:
  replicas: 2
  selector:
    matchLabels:
      app: approved-support
  strategy:
    canary:
      stableService: support-stable
      canaryService: support-canary
      steps:
        - setWeight: 50
        - analysis:
            templates:
              - templateName: approved-support
  template:
    metadata:
      labels:
        app: approved-support
    spec:
      automountServiceAccountToken: false
      containers:
        - name: support
          image: BASELINE_IMAGE
          imagePullPolicy: Never
          ports:
            - containerPort: 8100
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8100
            periodSeconds: 1
          volumeMounts:
            - name: targets
              mountPath: /etc/releasetrace
              readOnly: true
      volumes:
        - name: targets
          configMap:
            name: evaluation-targets
